# Nginx reverse proxy untuk Stock Intelligence API
# Simpan sebagai: /etc/nginx/sites-available/stock-intelligence
# Aktifkan: ln -s /etc/nginx/sites-available/stock-intelligence /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;  # Ganti dengan domain atau IP VPS

    # Logging
    access_log /var/log/nginx/stock-access.log;
    error_log  /var/log/nginx/stock-error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    # Proxy ke FastAPI
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeout untuk long-running AI reports
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Ukuran request (upload CSV transaksi)
        client_max_body_size 10M;
    }

    # Health check endpoint langsung
    location /health {
        proxy_pass http://127.0.0.1:8000/health;
    }

    # OpenAPI docs
    location /docs {
        proxy_pass http://127.0.0.1:8000/docs;
    }

    # Static frontend (opsional — jika frontend juga di VPS)
    location / {
        try_files $uri $uri/ /index.html;
        root /opt/stock-intelligence/frontend;
    }
}

